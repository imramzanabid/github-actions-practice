name: Multi Job Workflow

on:
  push:
    branches:
      - main

env:
  APP_NAME: my-awesome-app
  VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build karo
        run: echo "Building $APP_NAME version $VERSION"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test karo
        run: echo "Testing $APP_NAME version $VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy karo
        run: echo "Deploying $APP_NAME version $VERSION"